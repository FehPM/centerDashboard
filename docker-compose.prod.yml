services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 10s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: ['redisdata:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      target: runtime
    env_file: ['${ENV_FILE:-.env}']
    # DATABASE_URL/REDIS_URL do .env normalmente apontam para localhost (uso local
    # com docker-compose.yml, que publica as portas no host). Dentro da rede deste
    # compose, os serviços são alcançados pelo nome (postgres/redis), não localhost.
    # Este bloco tem precedência sobre env_file para as mesmas chaves.
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      # Um proxy reverso na frente da API (padrão em produção); ajuste se a topologia mudar.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      # Back-office (mundo do operador) e CORS: devem existir e bater com as URLs públicas.
      OPERATOR_JWT_SECRET: ${OPERATOR_JWT_SECRET:?defina OPERATOR_JWT_SECRET (>=32 caracteres, diferente de JWT_SECRET)}
      PANEL_ORIGIN: ${PANEL_ORIGIN:-http://localhost:3333}
      BACKOFFICE_ORIGIN: ${BACKOFFICE_ORIGIN:-http://localhost:8080}
      MONDAY_API_TOKEN: ${MONDAY_API_TOKEN:-}
    # Publicada só em loopback por padrão: com TRUST_PROXY_HOPS=1, um acesso direto
    # de fora poderia forjar X-Forwarded-For. O proxy reverso do mesmo host alcança
    # a porta por 127.0.0.1; use API_BIND=0.0.0.0 só se o proxy estiver em outra máquina.
    ports: ['${API_BIND:-127.0.0.1}:3333:3333']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: sh -c "npx prisma migrate deploy && node dist/main.js"
    restart: unless-stopped

  sync:
    build: { context: ., target: runtime }
    env_file: ['${ENV_FILE:-.env}']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      api: { condition: service_started }
    command: node dist/sync/sync-worker-main.js
    restart: unless-stopped

  backoffice:
    build:
      context: .
      target: backoffice
      args:
        # URL pública da API, embutida no bundle do back-office em tempo de build.
        VITE_API_URL: ${BACKOFFICE_API_URL:-http://localhost:3333}
    ports: ['${BACKOFFICE_BIND:-127.0.0.1}:8080:80']
    restart: unless-stopped

  whatsapp:
    profiles: ["whatsapp"]
    build: { context: ., target: runtime }
    env_file: ['${ENV_FILE:-.env}']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      api: { condition: service_started }
      redis: { condition: service_healthy }
    command: node dist/whatsapp/worker-main.js
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
